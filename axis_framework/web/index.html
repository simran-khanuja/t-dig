  });
  el.querySelector('#respin').onclick = () => { FOCUS = null; KEEPNOW = false; again('fresh'); };
  const nd = el.querySelector('#newdraw');
  if (nd) nd.onclick = () => { FOCUS = null; KEEPNOW = false; again('fresh', true); };
  el.querySelector('#layer').onclick = () => { FOCUS = null; KEEPNOW = false; again('layer'); };
  wireKeep(el, t.images, () => again('layer'));
  wireActs(el, (i, ax) => {
    FOCUS = null; KEEPNOW = false;
    const b = withSampling({session_id: S.session_id, axis: ax, k: draft.k, mode: 'layer', focus: i});
    if (OFFAXIS && rung(draft.offIdx)) b.off_axis = rung(draft.offIdx).off_axis;
    step('/session/respin', b, `making 4 versions of picture ${i + 1}`).catch(() => {});
  });
  el.querySelector('#axis2').oninput = (e) => {
    e.target.dataset.dirty = '1'; relabel(); REPHRASED = null; el.querySelector('#rcard2').innerHTML = '';
    liveRephrase(el.querySelector('#rcard2'), e.target, t.axis);
  };

  // A chip fills the box; the user then picks Generate or Edit.
  repaint = () => paintChips(el, (a) => {
    applyChip(el.querySelector('#axis2'), a.name, relabel);
  });
  repaint();

  // The comment is sent with the verdict (/session/review stores it on the trial and the
  // `review` event). Both Yes and No finish the picture.
  const comment = () => el.querySelector('#rvtext').value.trim() || null;
  const lock = () => ['#acc', '#rej'].forEach(q => el.querySelector(q).disabled = true);
  // Study mode: both scales are required (the server also enforces this).
  const ratings = {};
  let tipKey = null;
  const showTip = () => {
    const tip = feedbackTip(ratings, el.querySelector('#rvtext').value, t.axis);
    const slot = el.querySelector('#tip');
    if (!tip) { slot.innerHTML = ''; tipKey = null; return; }
    if (tip.key === tipKey) return;
    tipKey = tip.key;
    slot.innerHTML = `<div class="chipask"><span class="ask-t">${tip.text}</span><span class="ask-b">
      ${tip.less ? '<button class="btn tiny" data-tip="less">Less variety</button>' : ''}
      ${tip.more ? '<button class="btn tiny" data-tip="more">More variety</button>' : ''}
      ${S.can_edit ? '<button class="btn tiny" data-tip="edit">Edit these</button>' : ''}</span></div>`;
    uiLog('tip_shown', {key: tip.key, ratings: Object.assign({}, ratings)});
    slot.querySelectorAll('[data-tip]').forEach(b => b.onclick = () => {
      uiLog('tip_used', {key: tip.key, action: b.dataset.tip});
      if (b.dataset.tip === 'less') nudgeSlider(el, -1);
      else if (b.dataset.tip === 'more') nudgeSlider(el, +1);
      else { const lb = el.querySelector('#layer'); lb.scrollIntoView({behavior: 'smooth', block: 'center'}); lb.focus(); }
    });
  };
  el.querySelectorAll('.scale').forEach(sc => sc.querySelectorAll('button').forEach(b => b.onclick = () => {
    ratings[sc.dataset.scale] = +b.dataset.v;
    sc.querySelectorAll('button').forEach(x => x.classList.toggle('gen', x === b));
    showTip();
  }));
  // Outside a study there is no verdict panel.
  if (!STUDY.on) return el;
  el.querySelector('#rvtext').oninput = showTip;
  const rated = () => {
    if (!STUDY.on || (ratings.varied && ratings.matched)) return true;
    document.getElementById('err').textContent = 'Please answer both 1–5 questions first.';
    return false;
  };

  // Download before /session/review: its repaint would drop the blob mid-save.
  el.querySelector('#acc').onclick = async () => {
    if (!rated()) return;
    const c = comment(); lock();
    if (!STUDY.on) await downloadOrAll(t.images);
    await step('/session/review', {session_id: S.session_id, decision: 'accept', comment: c,
                                   ratings: STUDY.on ? ratings : undefined},
               'finishing your pictures at full quality');
  };
  el.querySelector('#rej').onclick = async () => {
    if (!rated()) return;
    const c = comment(); lock();
    await step('/session/review',
               {session_id: S.session_id, decision: 'reject', finish: true, comment: c,
                ratings: STUDY.on ? ratings : undefined},
               'saving');
  };
  return el;
}

function screenDone() {
  if (STUDY.on) return screenStudyDone();
  const t = S.trials.length ? S.trials[S.trials.length - 1] : null;
  const took = t && t.decision === 'accept';
  // Feedback is asked here only when there was no review page ("no variety needed").
  const reviewed = !!(t && t.decision);
  const el = $(`<div class="card final">
    <p class="eyebrow">Finished</p>
    <h2>${took ? 'Here they are' : 'Thanks'}</h2>
    ${took
      ? '<p class="lede">Re-made at full quality. Right-click any picture to save it.</p>'
      : reviewed
        ? ''
        : '<p class="lede">You said these outputs did not need more variety — that is a useful answer too.</p>'}
    ${took ? `<div class="grid k${t.images.length}">${t.images.map(img).join('')}</div>` : ''}
    <div class="feedback" style="margin-top:22px" ${reviewed ? 'hidden' : ''}>
      <p class="eyebrow">Optional</p>
      <p class="lede" style="margin-bottom:8px">How well did this get you the variety you wanted?</p>
      <div class="row" id="rate">${[1, 2, 3, 4, 5].map(n =>
        `<button class="btn" data-r="${n}">${n}</button>`).join('')}
        <span class="hint">1 = not at all, 5 = exactly</span></div>
      <textarea id="fbtext" rows="3" style="width:100%;margin-top:10px;box-sizing:border-box"
        placeholder="Anything that worked well, was confusing, or that you wished it did?"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="fbsend">Send feedback</button>
        <span class="hint" id="fbmsg"></span>
      </div>
    </div>
    <div class="row" style="margin-top:20px">
      <button class="btn gen" id="again">Start another picture</button>
    </div>
  </div>`);
  let rating = null;
  el.querySelectorAll('#rate button').forEach(b => b.onclick = () => {
    rating = +b.dataset.r;
    el.querySelectorAll('#rate button').forEach(x => x.classList.toggle('gen', x === b));
  });
  el.querySelector('#fbsend').onclick = async () => {
    const text = el.querySelector('#fbtext').value.trim();
    if (rating == null && !text) { el.querySelector('#fbmsg').textContent = 'Pick a number or write something first.'; return; }
    try {
      const r = await fetch('session/feedback', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: S.session_id, rating, text})});
      if (!r.ok) throw new Error((await r.json()).error || r.statusText);
      el.querySelector('#fbsend').disabled = true;
      el.querySelector('#fbmsg').textContent = 'Thank you — saved.';
    } catch (e) { el.querySelector('#fbmsg').textContent = 'Could not save: ' + e.message; }
  };
  el.querySelector('#again').onclick = () => start();
  return el;
}

  const varied = S.needs_diversity !== false;
  if (store.get('axis_study_last') !== S.session_id) {

    if (varied) store.set(doneKey(), String(picturesDone() + 1));
    uiLog('study_picture_done', {done: picturesDone(), of: STUDY.pictures, counted: varied});
  }
  const done = picturesDone(), left = STUDY.pictures - done;
  if (left <= 0) return screenQuestionnaire();
  if (!varied) {
    const el0 = $(`<div class="card narrow final">
      <p class="eyebrow">Recorded</p>
      <h2>Thank you — that answer is saved</h2>
      <p class="lede">A set you accepted as it is does <b>not count</b> towards your ${STUDY.pictures}
        sets. You still have <b>${left}</b> to do for which you ask for variety. Please try a
        different prompt.</p>
      <div class="row" style="margin-top:20px">
        <button class="btn gen" id="again">Next set (${done + 1} of ${STUDY.pictures})</button>
      </div></div>`);
    el0.querySelector('#again').onclick = () => start();
    return el0;
  }
  const el = $(`<div class="card narrow final">
    <p class="eyebrow">Set ${done} of ${STUDY.pictures} finished</p>
    <h2>Thank you — ${left} more to go</h2>
    <p class="lede">For the next one, please use a <b>different prompt</b> and think about what
      you would like to vary this time.</p>
    <div class="row" style="margin-top:20px">
      <button class="btn gen" id="again">Next set (${done + 1} of ${STUDY.pictures})</button>
    </div></div>`);
  el.querySelector('#again').onclick = () => start();
  return el;
}

const SCALE = (name, lo, hi) => `<div class="scale" data-q="${name}">${[1, 2, 3, 4, 5].map(n =>
  `<button type="button" class="btn" data-v="${n}">${n}</button>`).join('')}
  <span class="ends">1 = ${lo} · 5 = ${hi}</span></div>`;

function screenQuestionnaire(returning = false) {
  const sug = store.get('axis_study_suggestions_' + STUDY_SCOPE + '_' + PID) !== 'off';
  const el = $(`<div class="card narrow qn">
    <p class="eyebrow">Last step</p>
    <h2>A few questions about the whole experience</h2>
    <label class="q">How useful was it to say <em>what</em> should vary, compared with simply getting four images?</label>
    ${SCALE('control_useful', 'not useful', 'very useful')}
    <label class="q">When you moved the variety slider, did the result change the way you expected?</label>
    ${SCALE('slider_expected', 'not at all', 'exactly')}
    <label class="q" for="q_mode">“Generate new” makes a new set; “Edit these” changes the images you already have. Which did you prefer?</label>
    <select id="q_mode"><option value="">— choose —</option><option>Generate new</option><option>Edit these</option>
      <option>Both, for different things</option><option>No preference</option><option>I only used one of them</option></select>
    ${sug ? `<label class="q" for="q_sug">The system suggested things to vary. How did you use the suggestions?</label>
    <select id="q_sug"><option value="">— choose —</option><option>Mostly used the suggestions</option>
      <option>Mostly wrote my own</option><option>A mix of both</option><option>I did not notice them</option></select>
    <label class="q">How useful were the suggestions?</label>
    ${SCALE('suggestions_useful', 'not useful', 'very useful')}` : ''}
    <label class="q" for="q_exp">How often do you use AI image generators?</label>
    <select id="q_exp"><option value="">— choose —</option><option>Never before today</option>
      <option>A few times</option><option>Monthly</option><option>Weekly or more</option></select>
    <label class="q" for="q_missing">Was there something you wanted to vary that the tool could not do? Please describe it.</label>
    <textarea id="q_missing" rows="3"></textarea>
    <label class="q">Did you enjoy this task?</label>
    ${SCALE('enjoyed', 'not at all', 'very much')}
    <label class="q" for="q_more">Would you like to be invited to a follow-up study?</label>
    <select id="q_more"><option value="">— choose —</option><option>Yes</option><option>Maybe</option><option>No</option></select>
    <label class="q" for="q_other">Anything else? <span class="hint">(optional)</span></label>
    <textarea id="q_other" rows="2"></textarea>
    <div class="row" style="margin-top:18px">
      <button class="btn gen" id="qsend">Submit and get my completion code</button>
      <span class="hint" id="qmsg"></span>
    </div>
    ${returning && !PROLIFIC.session_id ? `<p class="hint" style="margin-top:16px">Already submitted this questionnaire and want to do more?
      <button type="button" class="btn tiny ghost" id="qnewround">Start another round (${STUDY.pictures} sets)</button></p>` : ''}
    </div>`);
  const nr = el.querySelector('#qnewround');
  if (nr) nr.onclick = () => {
    store.set(roundKey(), String(studyRound() + 1));
    uiLog('study_new_round', {round: studyRound(), from: 'questionnaire'});
    start();
  };
  const ans = {};
  el.querySelectorAll('.scale').forEach(sc => sc.querySelectorAll('button').forEach(b => b.onclick = () => {
    ans[sc.dataset.q] = +b.dataset.v;
    sc.querySelectorAll('button').forEach(x => x.classList.toggle('gen', x === b));
  }));
  el.querySelector('#qsend').onclick = async () => {
    const v = (q) => (el.querySelector(q) ? el.querySelector(q).value.trim() : '');
    Object.assign(ans, {mode_preference: v('#q_mode'),
                        experience: v('#q_exp'), missing: v('#q_missing'), other: v('#q_other'),
                        more_invite: v('#q_more')});
    // Require the suggestion answers only when those questions are on the page: whether they are
    // is decided when the questionnaire is drawn, and the stored arm flag can be absent or stale.
    const askedSug = !!el.querySelector('#q_sug');
    if (askedSug) ans.suggestions_use = v('#q_sug');
    const need = ['control_useful', 'slider_expected', 'mode_preference', 'experience', 'missing', 'enjoyed', 'more_invite']
      .concat(askedSug ? ['suggestions_use', 'suggestions_useful'] : []);
    const miss = need.filter(k => ans[k] == null || ans[k] === '');
    if (miss.length) { el.querySelector('#qmsg').textContent = 'Please answer every question (the last one is optional).'; return; }
    try {
      const r = await fetch('study/questionnaire', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: PID, client_id: CLIENT_ID, prolific: PROLIFIC,
                              pictures_done: picturesDone(), answers: Object.assign({study_round: studyRound()}, ans)})});
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      store.set(finishedKey(), JSON.stringify({completion_code: j.completion_code || '', completion_url: j.completion_url || ''}));
      document.getElementById('app').replaceChildren(screenCompletion(j));
    } catch (e) { el.querySelector('#qmsg').textContent = 'Could not save: ' + e.message; }
  };
  return el;
}

function screenCompletion(j, again = false) {
  const el = $(`<div class="card narrow final">
    <p class="eyebrow">Finished${studyRound() ? ` · round ${studyRound() + 1}` : ''}</p>
    <h2>${again ? 'You have already finished this round' : 'Thank you — you are done'}</h2>
    ${j.completion_code
      ? `<p class="lede">Your completion code:</p><div class="code">${escapeHtml(j.completion_code)}</div>
         <p><a class="btn gen" href="${escapeHtml(j.completion_url)}">Return to Prolific</a></p>`
      : '<p class="lede">Your answers are saved. (No completion code is configured for this run.)</p>'}
    ${PROLIFIC.session_id
      ? `<p class="lede" style="margin-top:22px">Want to do more? If the study is still open to you on
           Prolific, start a new submission there; it opens a fresh round here.</p>`
      : `<p class="lede" style="margin-top:22px">Want to do more? You can start another round of
           ${STUDY.pictures} sets with new prompts, then answer the short questionnaire again.</p>
         <div class="row"><button class="btn" id="newround">Start another round (${STUDY.pictures} sets)</button></div>`}
  </div>`);
  const nb = el.querySelector('#newround');
  if (nb) nb.onclick = () => {
    store.set(roundKey(), String(studyRound() + 1));
    uiLog('study_new_round', {round: studyRound()});
    start();
  };
  return el;
}

// The consent page text without the checkbox. Fetched on each open; opening is logged.
async function openHelp() {
  const box = document.getElementById('help'), body = document.getElementById('helpbody');
  try {
    body.innerHTML = (await (await fetch('study/instructions')).text())
      .replaceAll('{N}', String(STUDY.pictures)).replaceAll('{MODEL_NOTE}', modelNote());
  } catch (e) { body.textContent = 'The instructions could not be loaded. Please try again.'; }
  box.classList.add('on'); box.scrollTop = 0;
  uiLog('instructions_opened', {state: S ? S.state : null});
}
function closeHelp() {
  const box = document.getElementById('help');
  if (!box.classList.contains('on')) return;
  box.classList.remove('on');
  uiLog('instructions_closed', {});
}
document.getElementById('helpbtn').onclick = openHelp;
document.getElementById('helpx').onclick = closeHelp;
document.getElementById('help').onclick = (e) => { if (e.target.id === 'help') closeHelp(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHelp(); });

async function screenConsent() {
  const app = document.getElementById('app');
  let html = '';
  try { html = await (await fetch('study/instructions')).text(); } catch (e) { html = '<p>Instructions could not be loaded. Please reload.</p>'; }
  html = html.replaceAll('{N}', String(STUDY.pictures)).replaceAll('{MODEL_NOTE}', modelNote());
  const el = $(`<div class="card study-doc">${html}
    <div class="row" style="margin-top:22px">
      <label><input type="checkbox" id="agree"> I have read these instructions, I understand that
        low-quality submissions are rejected, and I agree to take part.</label></div>
    <div class="row" style="margin-top:12px"><button class="btn gen" id="cgo" disabled>Start</button></div></div>`);
  const version = (el.querySelector('[data-version]') || {dataset: {}}).dataset.version || '';
  el.querySelector('#agree').onchange = (e) => { el.querySelector('#cgo').disabled = !e.target.checked; };
  el.querySelector('#cgo').onclick = async () => {
    store.set('axis_study_consent_' + STUDY_SCOPE + '_' + PID, version || 'yes');
    try { await fetch('study/consent', {method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: PID, client_id: CLIENT_ID, prolific: PROLIFIC, agreed: true, version})}); } catch (e) {}
    start();
  };
  app.replaceChildren(el);
  window.scrollTo({top: 0});
}

// ---------------------------------------------------------------- shell

const STEPS = [['START', 'Prompt'], ['GATE', 'Look'], ['CHOOSE_AXIS', 'What varies'],
               ['REVIEW', 'Review']];

function paintSteps() {
  const box = document.getElementById('steps');
  if (!S) { box.innerHTML = ''; return; }
  // The "Look" step is skipped outside a study.
  const steps = STUDY.on ? STEPS : STEPS.filter(([k]) => k !== 'GATE');
  const at = steps.findIndex(([k]) => k === S.state);
  box.innerHTML = steps.map(([k, label], i) => {
    const cls = S.state === 'DONE' ? 'done' : i === at ? 'now' : i < at ? 'done' : '';
    return `<span class="step ${cls}">${i + 1}. ${label}</span>`;
  }).join('');
}

let shownState = null;

function render() {
  const app = document.getElementById('app');
  app.className = busy ? 'busy' : '';
  // Reset the screen's chip painter, relabeller and poll before the early return: start()
  // renders with S = null.
  repaint = null; relabel = null;
  clearInterval(pollTimer);
  pollTimer = null;
  paintSteps();
  if (!S) return;
  const by = {START: screenStart, GATE: screenGate, CHOOSE_AXIS: screenAxis,
              REVIEW: screenReview, DONE: screenDone};
  // #err lives outside #app, so clear it whenever the state changes.
  if (S.state !== shownState) {
    document.getElementById('err').textContent = '';
    uiLog('screen', {from: shownState, to: S.state});
  }
  // If a screen throws, report it and show an error instead of leaving the old screen up.
  let el;
  try {
    el = (by[S.state] || screenStart)();
  } catch (e) {
    reportClientError(e, 'render:' + S.state);
    document.getElementById('err').textContent =
      `This screen failed to draw (${S.state}): ${(e && e.message) || e}\n` +
      `The error has been logged. Your session is safe — reload the page to continue.`;
    shownState = null;
    return;
  }
  shownState = S.state;
  app.replaceChildren(el);
  window.scrollTo({top: 0, behavior: 'smooth'});
  syncPoll();
}

// Send client-side failures to the run's event log. Best-effort: never throws.
function reportClientError(e, screen) {
  try {
    fetch('client_error', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: (S && S.session_id) || null,
        client_state: (S && S.state) || null,
        screen: screen || null,
        message: String((e && e.message) || e),
        stack: String((e && e.stack) || ''),
        url: location.href})}).catch(() => {});
  } catch (_) { /* nothing useful left to do */ }
}

window.addEventListener('error', (ev) => reportClientError(ev.error || ev.message, 'window'));
window.addEventListener('unhandledrejection',
  (ev) => reportClientError(ev.reason, 'promise'));

// /models gives the run's T2I model (there is no picker; see the top of this file).
async function loadModels() {
  try {
    const j = await (await fetch('models')).json();
    MODELS = j.models || [];
    const usable = MODELS.filter(m => m.available !== false);
    if (!MODEL || !usable.some(m => m.key === MODEL))
      MODEL = (usable.find(m => m.key === j.default) || usable[0] || {}).key;
  } catch (e) { MODELS = []; }
}

async function loadCached() {
  try {
    const j = await (await fetch('prompts?model=' + encodeURIComponent(MODEL))).json();
    CACHED = j.prompts || [];
  } catch (e) { CACHED = []; }
}

// The ladder is fixed for the run, so it is fetched once.
async function loadLadder() {
  try {
    const j = await (await fetch('loras')).json();
    OFFAXIS = !!j.enabled;
    OFFAXIS_WHY = j.why;
    LADDER = (j.ladder || []).filter(r => r.available);
    if (j.default_off_axis != null) OFFAXIS_DEFAULT = j.default_off_axis;
    if (!LADDER.length) { OFFAXIS = false; OFFAXIS_WHY = OFFAXIS_WHY || 'no adapters exported'; }
    draft.offIdx = rungIndexFor(OFFAXIS_DEFAULT);
  } catch (e) { OFFAXIS = false; LADDER = []; }
}

// ---------------------------------------------------------------- study record
// Participant id and client-side UI events (clicks, changes, tab visibility, page leave).
// State changes are already logged server-side.

const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* private window */ } },
};
const CLIENT_ID = store.get('axis_client_id') || (() => {
  const v = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
                                               : 'c' + Math.random().toString(36).slice(2);
  store.set('axis_client_id', v);
  return v;
})();
// Participant id from the link: `pid` or Prolific's PROLIFIC_PID. Prolific's STUDY_ID and
// SESSION_ID are sent with every session.
const QS = new URLSearchParams(location.search);
const URL_PID = QS.get('pid') || QS.get('PROLIFIC_PID');
const PROLIFIC = {study_id: QS.get('STUDY_ID'), session_id: QS.get('SESSION_ID')};
// Study mode (orchestrator --study-pictures N), read from /health: N pictures, a rating on
// every finished set, a questionnaire, then the completion code. Progress is kept per
// participant in localStorage.
let STUDY = {on: false, pictures: 0, suggestions: 'on'};
// Progress keys are scoped per study: site path (/axis, /qwen, ...), Prolific STUDY_ID, and
// the server's run name (added from /health), since all sites share one origin.
// Bump STUDY_RESET to reset every participant's set counter, consent and suggestions setting.
const STUDY_RESET = '2026-09-25b';
let STUDY_SCOPE = (location.pathname.split('/').filter(Boolean)[0] || 'root') +
                  (PROLIFIC.study_id ? ':' + PROLIFIC.study_id : '');
// Rounds: a participant may repeat the study. Each round has its own set counter and
// questionnaire; consent and the suggestions arm stay per study. Round 0 has no suffix. A
// Prolific SESSION_ID (one per submission) also starts a fresh counter.
const roundKey = () => 'axis_study_round_' + STUDY_SCOPE + '_' + (PID || '');
const studyRound = () => +(store.get(roundKey()) || 0);
const doneKey = () => 'axis_study_done_' + STUDY_SCOPE + '_' + (PID || '') +
                      (studyRound() ? '_r' + studyRound() : '') +
                      (PROLIFIC.session_id ? ':' + PROLIFIC.session_id : '');
const finishedKey = () => doneKey() + '_code';     // set once this round's questionnaire is saved
const picturesDone = () => +(store.get(doneKey()) || 0);
if (URL_PID) store.set('axis_pid', URL_PID.trim().slice(0, 120));
let PID = store.get('axis_pid');
let ASK_PID = false;

const UIQ = [];
function uiLog(name, detail) {
  UIQ.push(Object.assign({t: Date.now(), name, state: (S && S.state) || null,
                          trials: (S && S.trials) ? S.trials.length : null}, detail || {}));
  if (UIQ.length >= 50) flushUI();
}
function flushUI(leaving) {
  if (!UIQ.length) return;
  const body = JSON.stringify({session_id: (S && S.session_id) || null, client_id: CLIENT_ID,
                               events: UIQ.splice(0)});
  try {
    if (leaving && navigator.sendBeacon &&
        navigator.sendBeacon('client_event', new Blob([body], {type: 'application/json'}))) return;
    fetch('client_event', {method: 'POST', headers: {'Content-Type': 'application/json'},
                           body, keepalive: true}).catch(() => {});
  } catch (_) { /* best-effort */ }
}
setInterval(flushUI, 5000);
document.addEventListener('visibilitychange', () => {
  uiLog(document.hidden ? 'tab_hidden' : 'tab_visible');
  if (document.hidden) flushUI(true);
});
window.addEventListener('pagehide', () => { uiLog('page_leave'); flushUI(true); });
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('button, .chip, img, a, summary, label, input');
  if (!b) return;
  const src = b.tagName === 'IMG' ? decodeURIComponent((b.getAttribute('src') || '')
                                      .replace(/^media\?path=/, '')).slice(-200) : undefined;
  uiLog('click', {tag: b.tagName.toLowerCase(), id: b.id || null,
                  cls: String(b.className || '').slice(0, 80) || null,
                  text: (b.innerText || b.value || '').trim().replace(/\s+/g, ' ').slice(0, 120) || null,
                  data: Object.keys(b.dataset || {}).length ? Object.assign({}, b.dataset) : null,
                  src});
}, true);
document.addEventListener('change', (e) => {
  const x = e.target;
  if (!x.matches || !x.matches('input, select, textarea')) return;
  uiLog('change', {id: x.id || null, type: x.type || x.tagName.toLowerCase(),
                   value: x.type === 'checkbox' ? x.checked : String(x.value).slice(0, 500)});
}, true);

function screenParticipant() {
  const app = document.getElementById('app');
  const el = $(`<div class="card narrow">
    <p class="eyebrow">Welcome</p>
    <h2>Before you start</h2>
    <p class="lede">${STUDY.on
      ? 'Please enter your <b>Prolific ID</b>. It is saved with what you do here, so your submission can be matched to you and approved.'
      : 'Please enter the name or participant ID you were given. It is saved with what you do here, so your sessions can be matched to you.'}</p>
    <input type="text" id="pid" class="big" autofocus placeholder="${STUDY.on ? 'your Prolific ID' : 'name or participant ID'}">
    <div class="row" style="margin-top:14px">
      <button class="btn gen" id="pidgo">Continue</button>
    </div>
  </div>`);
  const go = () => {
    const v = el.querySelector('#pid').value.trim().slice(0, 120);
    if (!v || (STUDY.on && !/^[A-Za-z0-9]{12,40}$/.test(v))) {
      if (STUDY.on) document.getElementById('err').textContent =
        'That does not look like a Prolific ID (24 letters and digits). Please check it.';
      el.querySelector('#pid').focus(); return;
    }
    document.getElementById('err').textContent = '';
    PID = v; store.set('axis_pid', v);
    uiLog('participant_entered', {participant_id: v});
    start();
  };
  el.querySelector('#pidgo').onclick = go;
  el.querySelector('#pid').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  app.replaceChildren(el);
}

async function start() {
  S = null; SEL.clear(); draft.axis = ''; render();
  if (ASK_PID && !PID) { screenParticipant(); return; }
  if (STUDY.on && !store.get('axis_study_consent_' + STUDY_SCOPE + '_' + PID)) { await screenConsent(); return; }
  if (STUDY.on && picturesDone() >= STUDY.pictures) {
    const fin = store.get(finishedKey());
    document.getElementById('app').replaceChildren(fin ? screenCompletion(JSON.parse(fin), true) : screenQuestionnaire(true));
    return;
  }
  if (!MODELS.length) await loadModels();
  await loadCached();
  const r = await fetch('session/new', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({model: MODEL, user_id: PID,
                                           client_id: CLIENT_ID, prolific: PROLIFIC,
                                           study_picture: STUDY.on ? picturesDone() + 1 : undefined,
                                           screen: `${innerWidth}x${innerHeight}`})});
  S = await r.json();
  if (STUDY.on && S.suggestions) store.set('axis_study_suggestions_' + STUDY_SCOPE + '_' + PID, S.suggestions);
  uiLog('session_start', {participant_id: PID});
  render();
}

(async () => {
  try {
    const h = await (await fetch('health')).json();
    NIID = h.n_iid || NIID; K = h.k || K;
    ASK_PID = !!h.ask_participant;
    if (h.study && h.study.on) STUDY = h.study;
    if (h.run) STUDY_SCOPE += '@' + h.run;
    STUDY_SCOPE += '#' + STUDY_RESET;
    document.getElementById('helpbtn').hidden = !STUDY.on;
    KCHOICES = h.k_choices || [K]; KTRAINED = h.k_trained || K;
    draft.k = SHOW_K_CHOICE ? (KCHOICES.includes(K) ? K : KCHOICES[0]) : KTRAINED;
  } catch (e) { /* defaults are fine */ }
  await loadLadder();
  await loadModels();
  await start();
})();
</script>
